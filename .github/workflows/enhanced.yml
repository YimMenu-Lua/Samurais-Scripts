name: Update and Validate Enhanced

on:
  push:
    branches: [main]
    paths:
      - 'SSV2/includes/data/**'
      - 'SSV2/includes/version.lua'
      - 'SSV2-enhanced/**'
      - 'dev/scripts/enhanced/**'
      - 'dev/scripts/release/**'
      - '.github/workflows/enhanced.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ss_generated-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  enhanced:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.x'

      - name: Sync Enhanced Data
        run: python dev/scripts/enhanced/sync_enhanced.py

      - name: Test Data Sync and Release Packaging
        run: python -m unittest discover -s dev/scripts/enhanced/tests -v

      - name: Check Enhanced Lua Syntax
        run: |
          python -m pip install -r SSV2-enhanced/tests/requirements.txt
          python dev/scripts/enhanced/check_lua.py

      - name: Commit Generated Data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add SSV2-enhanced/includes/ssv2/data/
          git diff --cached --quiet || git commit -m 'chore(enhanced): sync shared data'
          git push
