name: Generate Translations

on:
  push:
    branches:
      - main
    paths:
      - "dev/scripts/translations/**"
      - "SSV2/includes/lib/translations/en-US.lua"
      - "SSV2/includes/lib/translations/__locales.lua"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ss_generated-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:

    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref_name }}

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12.x"

    - name: Run Generator
      run: |
        cd ./dev/scripts/translations
        python generate_translations.py

    - name: Commit Changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add SSV2/includes/lib/translations/
        git add SSV2-enhanced/includes/ssv2/data/locales/ SSV2-enhanced/includes/ssv2/data/locale_codes.lua SSV2-enhanced/includes/ssv2/data/gxt_labels.lua
        git diff --cached --quiet || git commit -m "chore(Translations): update translations"
        git push
