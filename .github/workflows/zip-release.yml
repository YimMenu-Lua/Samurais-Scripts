name: Zip Release

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ss_generated-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  release:
    name: CI Main
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[noci]')"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ github.ref_name }}
    
    - name: Check Changes
      id: check_changes
      uses: actions/github-script@v9
      with:
        script: |
          if (context.eventName === "workflow_dispatch") {
            core.setOutput("should_proceed", "true");
            return;
          }

          const { owner, repo } = context.repo;
          const tags = await github.rest.repos.listTags({ owner, repo });
          if (tags.data.length === 0) {
            core.setOutput("should_proceed", "true");
            return;
          }

          const lastTag = tags.data[0].name;
          const compare = await github.rest.repos.compareCommits({
            owner,
            repo,
            base: lastTag,
            head: "HEAD"
          });

          const files = compare.data.files || [];
          const releaseFiles = files.filter(f =>
            f.filename.endsWith(".lua") ||
            f.filename === ".github/workflows/zip-release.yml" ||
            f.filename.startsWith("dev/scripts/release/") ||
            f.filename.startsWith("dev/scripts/enhanced/")
          );
          core.setOutput(
            "should_proceed",
            releaseFiles.length != 0 ? "true" : "false"
          );

    - name: Increment Tag
      id: increment_tag
      if: steps.check_changes.outputs.should_proceed == 'true'
      uses: actions/github-script@v9
      with:
        script: |
          const owner = context.repo.owner;
          const repo  = context.repo.repo;
          const tags  = await github.rest.repos.listTags({ owner, repo });

          let no_prefix;
          let new_tag;
          let old_tag;

          if (tags.data.length === 0) {
            new_tag = 'v1.0.0';
            no_prefix = '1.0.0';
          } else {
            const latest = tags.data[0].name.substring(1).split('.').map(Number);
            if (latest[1] === 9 && latest[2] === 9) {
              latest[0] += 1; latest[1] = 0; latest[2] = 0;
            } else if (latest[2] === 9) {
              latest[1] += 1; latest[2] = 0;
            } else {
              latest[2] += 1;
            }
            no_prefix = latest.join('.');
            new_tag   = `v${latest.join('.')}`;
            old_tag   = tags.data[0].name;
          }

          core.setOutput("version_number", new_tag);
          core.setOutput("no_prefix", no_prefix);
          core.setOutput("old_tag", old_tag);
    
    - name: Generate Changelog
      id: changelog
      if: steps.check_changes.outputs.should_proceed == 'true'
      uses: actions/github-script@v9
      with:
        script: |
          const { owner, repo } = context.repo;
          const lastTag = "${{ steps.increment_tag.outputs.old_tag }}";
          if (!lastTag) {
            core.setOutput("changelog", "Initial release of the legacy and native Enhanced editions.");
            return;
          }
          const { data: tagRefs } = await github.rest.git.getRef({ owner, repo, ref: `tags/${lastTag}` });
          const tagSha = tagRefs.object.sha;
          const { data: tagCommit } = await github.rest.repos.getCommit({ owner, repo, ref: tagSha });
          const lastTagDate = new Date(tagCommit.commit.committer.date);
          const { data: pulls } = await github.rest.pulls.list({
            owner, repo, state: "closed", sort: "updated", direction: "asc", per_page: 100
          });

          let changelog = "";
          let breaking = false;
          let breakingMsg = ">[!Important]\n>**This is a breaking change**\n>To install this update, please remove the previous version completely and then install the new version.\n\n";

          function isBreakingChange(str) { return str.toLowerCase().includes("breaking change"); }

          const commitHashes = new Set();
          const mergedPRs = pulls.filter(pr => pr.merged_at && new Date(pr.merged_at) > lastTagDate);
          if (mergedPRs.length > 0) {
            for (const pr of mergedPRs) {
              changelog += `### PR #${pr.number}: ${pr.title}\n`;
              const body = pr.body;
              if (body) {
                breaking = breaking || isBreakingChange(body);
                changelog += `${body.trim()}\n\n`;
              }
              const prCommits = await github.paginate(
                github.rest.pulls.listCommits,
                {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100
                }
              );

              for (const prCommit of prCommits) {
                commitHashes.add(prCommit.sha);
              }
            }
          }

          const compared = await github.rest.repos.compareCommits({
            owner,
            repo,
            base: lastTag,
            head: "main"
          });
          const commits = compared.data.commits;
          for (const commit of commits) {
            if (commitHashes.has(commit.sha)) {
              continue;
            }

            const msg = commit.commit.message || "";
            const body = commit.commit.body;
            const msgLower = msg.toLowerCase();
            if (msgLower.startsWith("merge ") || msgLower.startsWith("[noci]"))
              continue;

            breaking = breaking || isBreakingChange(msg);
            changelog += `## ${msg}\n\n`;
            if (body) {
              breaking = breaking || isBreakingChange(body);
              changelog += `${body.trim()}\n\n`;
            }
          }

          if (breaking) {
            changelog = `${breakingMsg}${changelog}`
          }
          core.setOutput("changelog", changelog);

    - name: Setup Python
      if: steps.check_changes.outputs.should_proceed == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12.x"

    - name: Bump Version
      if: steps.check_changes.outputs.should_proceed == 'true'
      run: |
        ONLINE_VERSION=$(sed -n "s/.*eGameBranch.LEGACY.*online *= *\"\([^\"]*\)\".*/\1/p" SSV2/includes/init.lua)
        LEGACY_BUILD=$(sed -n "s/.*eGameBranch.LEGACY.*build *= *\"\([^\"]*\)\".*/\1/p" SSV2/includes/init.lua)
        ENHANCED_BUILD=$(sed -n "s/.*eGameBranch.ENHANCED.*build *= *\"\([^\"]*\)\".*/\1/p" SSV2/includes/init.lua)
        sed -i "s|https://img.shields.io/badge/Online%20Version-\([^\"]*\)-green|https://img.shields.io/badge/Online%20Version-$ONLINE_VERSION-green|g" README.md
        sed -i "s|https://img.shields.io/badge/Legacy-\([^\"]*\)-green|https://img.shields.io/badge/Legacy-$LEGACY_BUILD-green|g" README.md
        sed -i "s|https://img.shields.io/badge/Enhanced-\([^\"]*\)-green|https://img.shields.io/badge/Enhanced-$ENHANCED_BUILD-green|g" README.md
        sed -i "s|https://img.shields.io/badge/Latest%20Release-v[0-9]\+\.[0-9]\+\.[0-9]\+-blue|https://img.shields.io/badge/Latest%20Release-${{ steps.increment_tag.outputs.version_number }}-blue|g" README.md
        sed -i "s|return \".*\"|return \"${{ steps.increment_tag.outputs.no_prefix }}\"|" SSV2/includes/version.lua
        python dev/scripts/enhanced/sync_enhanced.py
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add SSV2/includes/version.lua README.md SSV2-enhanced/includes/ssv2/data/
        git diff --cached --quiet || git commit -m "[noci] bump version"
        git push

    - name: Create Archive
      if: steps.check_changes.outputs.should_proceed == 'true'
      run: python dev/scripts/release/build_release.py --version '${{ steps.increment_tag.outputs.version_number }}'

    - name: Upload Release
      if: steps.check_changes.outputs.should_proceed == 'true'
      uses: softprops/action-gh-release@v3
      with:
        name: Samurai's Scripts ${{ steps.increment_tag.outputs.version_number }}
        tag_name: ${{ steps.increment_tag.outputs.version_number }}
        body: |
          ## Changelog
          ${{ steps.changelog.outputs.changelog }}

          This ZIP contains `SSV2` for YimMenu and `SSV2-enhanced` for the native YimMenuV2 Lua API. Install the edition for your menu.
        files: |
          Samurais_Scripts_${{ steps.increment_tag.outputs.version_number }}.zip
